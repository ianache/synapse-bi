name: synapse-bi-study

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    restart: unless-stopped
    environment:
      POSTGRES_USER: bi_admin
      POSTGRES_DB: bi_analytics
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      # Official PostgreSQL 18+ image uses a major-version subdirectory here.
      - postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    secrets:
      - admin_password
      - reader_global_password
      - reader_other_password
    shm_size: 128mb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          && psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          'SELECT count(*) FROM gold.case_study_manifest WHERE version = 1' | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  verify:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [bash, /study/verify.sh]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: bi_analytics
    volumes:
      - ./tests:/study:ro
    secrets:
      - admin_password
      - reader_global_password
      - reader_other_password

  keycloak-db-init:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [bash, /study/keycloak-db-init.sh]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: bi_analytics
      PGUSER: bi_admin
    volumes:
      - ./keycloak:/study:ro
    secrets:
      - admin_password
      - keycloak_db_password

  keycloak:
    image: ${KEYCLOAK_IMAGE:-keycloak/keycloak:26.8}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    entrypoint: [bash, /study/keycloak-start.sh]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: bi_analytics
      KC_DB_USERNAME: keycloak
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-58080}:8080"
    volumes:
      - ./keycloak:/study:ro
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:

secrets:
  admin_password:
    file: ./.docker-secrets/admin_password.txt
  reader_global_password:
    file: ./.docker-secrets/reader_global_password.txt
  reader_other_password:
    file: ./.docker-secrets/reader_other_password.txt
  keycloak_db_password:
    file: ./.docker-secrets/keycloak_db_password.txt
  keycloak_admin_password:
    file: ./.docker-secrets/keycloak_admin_password.txt
