[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "synapse-bi-api"
version = "0.1.0"
description = "Tenant-scoped semantic queries and dashboard API for Synapse BI"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "PyJWT[crypto]==2.13.0",
    "psycopg[binary]==3.3.6",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["synapse_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
